name: ci
# Standalone checks that need no engine: the C++ conformance binary
# (corpus byte-exactness + UE frame conversion + deriver, 19 checks) and
# the C# blueprint mirror (7/7 MATCH, exit 1 on any DIFF). The UE module
# itself
# needs the engine — build it on a self-hosted runner with UE installed:
#   ./sync-plugin.ps1 -Project ./TestProject -Build
on: [push, pull_request]

env:
  ORG: Open-Game-Standards-Alliance

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGSA-Telemetry-Standard
          path: OGSA-Telemetry-Standard
      - name: Configure + build
        run: |
          cmake -S Test -B Test/build
          cmake --build Test/build
      - name: Run conformance binary
        run: Test/build/ogsa_conformance
              "$GITHUB_WORKSPACE/OGSA-Telemetry-Standard/conformance"

  blueprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGSA-Telemetry-Standard
          path: OGSA-Telemetry-Standard
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Blueprint mirror (7/7 MATCH)
        run: dotnet run --project tools/blueprint --
              "$GITHUB_WORKSPACE/OGSA-Telemetry-Standard/conformance/vectors"

  notify-dotnet:
    # ogsa-ts-dotnet's own lockstep job checks this repo back and can
    # fail purely from push-order timing if this repo's sync lands after
    # ogsa-ts-dotnet's push — tell it to recheck now that this push
    # landed, so that self-heals without a manual re-run. Needs
    # CROSS_REPO_DISPATCH_TOKEN (a fine-grained PAT scoped to just the
    # Open-Game-Standards-Alliance engine repos, Contents: read +
    # Actions: read/write); skipped entirely (not failed) while unset.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [conformance, blueprint]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # the secrets context can't be read directly in an `if:` (GitHub
      # blocks it there); gate through this env var instead
      HAS_DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
    steps:
      - name: Dispatch sibling-pushed to ogsa-ts-dotnet
        if: env.HAS_DISPATCH_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.ORG }}/ogsa-ts-dotnet/dispatches" \
            -d "{\"event_type\":\"sibling-pushed\",\"client_payload\":{\"source\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\"}}"

  # Uncomment on a self-hosted runner with UE 5.8 installed:
  # module-build:
  #   runs-on: [self-hosted, windows, ue5.8]
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: ./sync-plugin.ps1 -Project ./TestProject -Build
