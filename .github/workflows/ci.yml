name: ci
# Standalone checks that need no engine: the C++ conformance binary
# (corpus byte-exactness + UE frame conversion + deriver) and the
# generated schema writers being current. The UE module itself
# needs the engine — build it on a self-hosted runner with UE installed:
#   ./sync-plugin.ps1 -Project ./TestProject -Build
on: [push, pull_request]

env:
  ORG: Open-Game-Standards

jobs:
  conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGS-Telemetry-Standard
          path: OGS-Telemetry-Standard
      - name: Configure + build
        run: |
          cmake -S Test -B Test/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Test/build --config Release
      - name: Run conformance binary
        # Release subdir only exists for multi-config generators (MSVC on
        # Windows); Unix Makefiles (Linux/macOS) put the binary straight
        # in build/.
        shell: bash
        run: |
          bin=Test/build/ogs_conformance
          [ -f Test/build/ogs_conformance.exe ] && bin=Test/build/ogs_conformance.exe
          [ -f Test/build/Release/ogs_conformance.exe ] && bin=Test/build/Release/ogs_conformance.exe
          "$bin" "$GITHUB_WORKSPACE/OGS-Telemetry-Standard/conformance"

  writers-current:
    # OgsTelemetrySchema.h must match what the shared generator emits for
    # the standard's schema (generated code is never hand-edited).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/OGS-Telemetry-Standard
          path: OGS-Telemetry-Standard
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.ORG }}/ogs-ts-dotnet
          path: ogs-ts-dotnet
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install pycapnp
      - run: python ogs-ts-dotnet/capnp/gen_writers.py --lang cpp
              --schema OGS-Telemetry-Standard/ogs_telemetry.capnp
              --out Source/OgsTelemetryCore/Public/OgsTelemetry/OgsTelemetrySchema.h
      - run: git diff --exit-code Source/OgsTelemetryCore

  notify-dotnet:
    # ogs-ts-dotnet's own lockstep job checks this repo back and can
    # fail purely from push-order timing if this repo's sync lands after
    # ogs-ts-dotnet's push — tell it to recheck now that this push
    # landed, so that self-heals without a manual re-run. Needs
    # CROSS_REPO_DISPATCH_TOKEN (a fine-grained PAT scoped to just the
    # Open-Game-Standards engine repos, with Contents: Read and
    # write — confirmed by a live 403 "Resource not accessible by
    # personal access token" from this endpoint when that permission was
    # missing; GitHub's own docs don't state it). Skipped entirely (not
    # failed) while unset.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [conformance, writers-current]
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # the secrets context can't be read directly in an `if:` (GitHub
      # blocks it there); gate through this env var instead
      HAS_DISPATCH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
    steps:
      - name: Dispatch sibling-pushed to ogs-ts-dotnet
        if: env.HAS_DISPATCH_TOKEN == 'true'
        env:
          TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/dispatch-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ env.ORG }}/ogs-ts-dotnet/dispatches" \
            -d "{\"event_type\":\"sibling-pushed\",\"client_payload\":{\"source\":\"${{ github.repository }}\",\"sha\":\"${{ github.sha }}\"}}")
          echo "HTTP status: $status"
          cat /tmp/dispatch-response.json 2>/dev/null || true
          # the response body is GitHub's own error text, never the token
          # (which curl never prints) — safe to show in logs for diagnosis
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "dispatch to ogs-ts-dotnet failed (see response above)"
            exit 1
          fi

  # Uncomment on a self-hosted runner with UE 5.8 installed:
  # module-build:
  #   runs-on: [self-hosted, windows, ue5.8]
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: ./sync-plugin.ps1 -Project ./TestProject -Build
